[project]
name = "basketballstats"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["code", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# One-line `if x: ...` is the house style; `== None` checks sit next to pandas code, so leave them to review.
ignore = ["E701", "E711", "E712"]
